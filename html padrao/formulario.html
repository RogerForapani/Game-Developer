<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form name="signup" method="post" autocomplete="on" onsubmit="alert('Enviei o formulário')" target="_blank" action="#"> <!-- Action serve para mandar informações para outro site método post serve
        capsular a informação e mandar ela para o outro site -->
        Este é o formulário
        <br>
        Nome: <input type="text" name="nome"><br>
        Idade: <input type="number" name="idade"><br>
        password: <input type="password" name="senha"><br>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
