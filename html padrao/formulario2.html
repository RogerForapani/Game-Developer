<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form name="signup" onsubmit="">
        <label>Text:</label><input type="text"><br>
        <label>Number:</label><input type="number" min="0" step="5" max="99"><br>
        <label>Range:</label><input type="range" min="0" max="100"><br>
        <label>Color:</label><input type="color" ><br>
        <label>Email:</label><input type="email" ><br>
        <label>Url:</label><input type="url" ><br>
        <label>Date:</label><input type="date" ><br>
        <label>Checkbox:</label><input type="checkbox" name="opcional[]" ><br> <!-- para o servidor entender que tem mais
        de uma opção, voce coloca no fomrm o metodo get e coloca name com as chaves para ele entender que é uma lista-->
        <label>Radio:</label><input type="radio" name="aceita"><input type="radio" name="aceita" ><br>
        <label>Cargo</label><select name="role" id="" >
            <option value="Administrativo">Assistente</option> <!-- o value é que vai para o backend como variavel-->
            <option value="Gerente">Gerente</option>
            <option value="Presidente">Presidente</option>
            <option value="Diretor">Diretor</option>
            <option selected value="Operador">Operador</option>
        </select> <br>
        <label>Text Area</label><textarea rows="10"></textarea>
        <button type="button" onclick="alert('Apertei o botao')" >Enviar</button> <!-- se o tipo for button você tem que utilizar uma função script-->
        <!-- onsubmit sempre deve ser colocado na tag form e não no botão, para evitar que a pessoa use o enter para envio do
         formulário e não ative a função onsubimt-->
        
    </form>
</body>
</html>
